name: Release
# Builds a signed, shrunk APK when a release is published (on GitHub or from Varde's Releases page) and attaches it.
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.VARDE_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VARDE_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VARDE_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VARDE_RELEASE_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Release signing isn't set up: secret VARDE_RELEASE_${name/KEYSTORE/KEYSTORE_B64} is missing. See docs/RELEASING.md."
              exit 1
            fi
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Decode release key
        env:
          KEYSTORE: ${{ secrets.VARDE_RELEASE_KEYSTORE_B64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Test and build
        run: |
          # Minutes since 2020: always increasing, across workflows and reruns.
          export VARDE_VERSION_CODE=$(( ($(date +%s) - 1577836800) / 60 ))
          gradle :app:testDebugUnitTest :app:assembleRelease
        env:
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          VARDE_RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
          VARDE_RELEASE_STORE_PASSWORD: ${{ secrets.VARDE_RELEASE_STORE_PASSWORD }}
          VARDE_RELEASE_KEY_ALIAS: ${{ secrets.VARDE_RELEASE_KEY_ALIAS }}
          VARDE_RELEASE_KEY_PASSWORD: ${{ secrets.VARDE_RELEASE_KEY_PASSWORD }}
      - name: Remove release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - name: Verify signature
        run: ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "varde-${TAG}.apk"
          gh release upload "$TAG" "varde-${TAG}.apk" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: varde-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt

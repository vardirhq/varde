name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find the latest release version
        # Debug builds are named after it (0.2.0-dev.57). Tags only; no history is needed.
        run: |
          git fetch --quiet --tags --force origin || true
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          echo "Latest release: ${latest:-none}"
          echo "VARDE_BASE_VERSION=${latest}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and test
        run: gradle :app:testDebugUnitTest :app:assembleDebug
        env:
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
      - name: Verify debug APK signing
        run: ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: varde-debug
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk
